# Locust 설정 파일
# 부하 테스트 기본 설정

# 웹 UI 설정
web-host = 0.0.0.0
web-port = 8089

# 기본 호스트
host = http://localhost:8001

# 로그 레벨
loglevel = INFO

# CSV 통계 출력
csv = load_test_results/default

# HTML 보고서 생성
html = load_test_results/default_report.html

