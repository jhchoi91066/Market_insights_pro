# Redis Configuration for Market Insights Pro
# Production-optimized settings

# 네트워크 설정
bind 0.0.0.0
port 6379
protected-mode no

# 일반 설정
timeout 0
keepalive 300
tcp-backlog 511

# 메모리 설정
maxmemory 512mb
maxmemory-policy allkeys-lru

# 데이터 지속성 설정
save 900 1
save 300 10
save 60 10000

# AOF 설정
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 로그 설정
loglevel notice
logfile ""

# 클라이언트 설정
maxclients 1000

# 성능 최적화
tcp-keepalive 60
database 16

# 보안 설정 (선택사항)
# requirepass your_password_here

# 슬로우 로그
slowlog-log-slower-than 10000
slowlog-max-len 128

# 클라이언트 출력 버퍼 제한
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60