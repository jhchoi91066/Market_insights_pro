<!DOCTYPE html>
<html lang="ko" class="h-full bg-gray-50 dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 실시간 모니터링 - Market Insights Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Styles -->
    <style>
        .card {
            @apply bg-white dark:bg-gray-800 shadow-lg rounded-lg p-6 border border-gray-200 dark:border-gray-700;
        }

        .stat-card {
            @apply bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-900 dark:to-indigo-900 p-4 rounded-lg border border-blue-200 dark:border-blue-700;
        }

        .alert-critical {
            @apply bg-red-50 border-l-4 border-red-500 p-4 dark:bg-red-900/20 dark:border-red-400;
        }

        .alert-high {
            @apply bg-orange-50 border-l-4 border-orange-500 p-4 dark:bg-orange-900/20 dark:border-orange-400;
        }

        .alert-medium {
            @apply bg-yellow-50 border-l-4 border-yellow-500 p-4 dark:bg-yellow-900/20 dark:border-yellow-400;
        }

        .metric-rising {
            @apply text-green-600 dark:text-green-400;
        }

        .metric-falling {
            @apply text-red-600 dark:text-red-400;
        }

        .metric-stable {
            @apply text-gray-600 dark:text-gray-400;
        }

        /* 로딩 애니메이션 */
        .spinner {
            @apply animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600;
        }

        .pulse-dot {
            @apply animate-pulse inline-block w-3 h-3 rounded-full;
        }
    </style>

    <!-- Dark Mode Toggle Script -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>

<body class="h-full font-sans antialiased">
    <div class="min-h-full">
        <!-- 네비게이션 헤더 -->
        <nav class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <h1 class="text-xl font-bold text-gray-900 dark:text-white">
                                🔥 실시간 모니터링
                            </h1>
                        </div>
                        <div class="ml-6 flex space-x-8">
                            <a href="/" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium">
                                ← 메인으로
                            </a>
                        </div>
                    </div>

                    <div class="flex items-center space-x-4">
                        <!-- 모니터링 상태 -->
                        <div class="flex items-center space-x-2">
                            <div class="pulse-dot bg-green-500"></div>
                            <span class="text-sm text-gray-600 dark:text-gray-400">실시간 모니터링 중</span>
                        </div>

                        <!-- 다크모드 토글 -->
                        <button id="dark-mode-toggle" class="p-2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 rounded-md">
                            <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                            </svg>
                            <svg class="w-5 h-5 block dark:hidden" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 메인 콘텐츠 -->
        <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            <!-- 키워드 검색 섹션 -->
            <div class="px-4 py-6 sm:px-0">
                <div class="card mb-8">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">모니터링 대시보드</h2>
                            <p class="text-gray-600 dark:text-gray-400 mt-1">실시간 트렌드 변화와 경쟁사 동향을 모니터링하세요</p>
                        </div>
                    </div>

                    <!-- 키워드 입력 -->
                    <div class="flex space-x-4">
                        <div class="flex-1">
                            <input
                                type="text"
                                id="monitoring-keyword"
                                placeholder="모니터링할 키워드를 입력하세요 (예: 무선마우스)"
                                class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                            >
                        </div>
                        <button
                            id="start-monitoring-btn"
                            class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors flex items-center space-x-2"
                        >
                            <span>🔍 모니터링 시작</span>
                        </button>
                    </div>

                    <!-- 워치리스트 관리 -->
                    <div class="mt-4 flex items-center space-x-4">
                        <button id="add-watchlist-btn" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">
                            📝 워치리스트에 추가
                        </button>
                        <button id="view-watchlist-btn" class="text-sm text-gray-600 dark:text-gray-400 hover:underline">
                            📋 워치리스트 보기
                        </button>
                    </div>
                </div>

                <!-- 로딩 상태 -->
                <div id="loading-indicator" class="hidden">
                    <div class="card text-center py-8">
                        <div class="spinner mx-auto mb-4"></div>
                        <p class="text-gray-600 dark:text-gray-400">모니터링 데이터를 수집하고 있습니다...</p>
                    </div>
                </div>

                <!-- 대시보드 메트릭 -->
                <div id="dashboard-metrics" class="hidden">
                    <!-- 요약 메트릭 카드 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <!-- 트렌드 상태 -->
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-blue-700 dark:text-blue-300 font-medium">트렌드 변동성</p>
                                    <p id="volatility-index" class="text-2xl font-bold text-gray-900 dark:text-white">-</p>
                                </div>
                                <div class="p-3 bg-blue-100 dark:bg-blue-800 rounded-full">
                                    <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- 경쟁사 수 -->
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-green-700 dark:text-green-300 font-medium">경쟁사 수</p>
                                    <p id="competitor-count" class="text-2xl font-bold text-gray-900 dark:text-white">-</p>
                                </div>
                                <div class="p-3 bg-green-100 dark:bg-green-800 rounded-full">
                                    <svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- 시장 건강도 -->
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-purple-700 dark:text-purple-300 font-medium">시장 건강도</p>
                                    <p id="market-health" class="text-2xl font-bold text-gray-900 dark:text-white">-</p>
                                </div>
                                <div class="p-3 bg-purple-100 dark:bg-purple-800 rounded-full">
                                    <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- 알림 수 -->
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-sm text-red-700 dark:text-red-300 font-medium">활성 알림</p>
                                    <p id="active-alerts" class="text-2xl font-bold text-gray-900 dark:text-white">-</p>
                                </div>
                                <div class="p-3 bg-red-100 dark:bg-red-800 rounded-full">
                                    <svg class="w-6 h-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5zM12 17H7l5 5v-5z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 3a9 9 0 019 9c0 .285-.02.566-.057.843a1 1 0 11-1.98-.286c.02-.189.037-.38.037-.557a7 7 0 10-7 7c.178 0 .368-.017.557-.037a1 1 0 01.286 1.98A9.065 9.065 0 0113 21a9 9 0 010-18z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 알림 섹션 -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                        <!-- 실시간 알림 -->
                        <div class="lg:col-span-2">
                            <div class="card">
                                <div class="flex items-center justify-between mb-6">
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">🚨 실시간 알림</h3>
                                    <button id="refresh-alerts-btn" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">
                                        새로고침
                                    </button>
                                </div>
                                <div id="alerts-container" class="space-y-4">
                                    <!-- 알림이 여기에 동적으로 추가됩니다 -->
                                </div>
                            </div>
                        </div>

                        <!-- 워치리스트 -->
                        <div>
                            <div class="card">
                                <div class="flex items-center justify-between mb-6">
                                    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">📝 워치리스트</h3>
                                </div>
                                <div id="watchlist-container" class="space-y-2">
                                    <!-- 워치리스트가 여기에 표시됩니다 -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 차트 섹션 -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- 트렌드 차트 -->
                        <div class="card">
                            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">📈 트렌드 변화</h3>
                            <div class="h-64">
                                <canvas id="trendChart"></canvas>
                            </div>
                        </div>

                        <!-- 경쟁 강도 차트 -->
                        <div class="card">
                            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">🏢 경쟁 강도</h3>
                            <div class="h-64">
                                <canvas id="competitionChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 빈 상태 -->
                <div id="empty-state" class="text-center py-12">
                    <div class="text-6xl mb-4">🔍</div>
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">모니터링을 시작해보세요</h3>
                    <p class="text-gray-600 dark:text-gray-400 mb-6">키워드를 입력하고 실시간 모니터링을 시작하세요</p>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script>
        class MonitoringDashboard {
            constructor() {
                this.currentKeyword = null;
                this.charts = {};
                this.watchlist = [];
                this.autoRefreshInterval = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupDarkModeToggle();
                this.loadWatchlist();

                // 자동 새로고침 (30초마다)
                this.startAutoRefresh();
            }

            setupEventListeners() {
                // 모니터링 시작
                document.getElementById('start-monitoring-btn').addEventListener('click', () => {
                    this.startMonitoring();
                });

                // 키워드 입력 시 엔터 키
                document.getElementById('monitoring-keyword').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startMonitoring();
                    }
                });

                // 워치리스트 관리
                document.getElementById('add-watchlist-btn').addEventListener('click', () => {
                    this.addToWatchlist();
                });

                document.getElementById('view-watchlist-btn').addEventListener('click', () => {
                    this.viewWatchlist();
                });

                // 알림 새로고침
                document.getElementById('refresh-alerts-btn').addEventListener('click', () => {
                    this.refreshAlerts();
                });
            }

            setupDarkModeToggle() {
                const toggle = document.getElementById('dark-mode-toggle');
                toggle.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                    localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                });
            }

            async startMonitoring() {
                const keyword = document.getElementById('monitoring-keyword').value.trim();
                if (!keyword) {
                    alert('키워드를 입력해주세요');
                    return;
                }

                this.currentKeyword = keyword;
                this.showLoading();

                try {
                    // 대시보드 데이터 수집
                    const response = await fetch(`/api/monitoring/dashboard/${encodeURIComponent(keyword)}`);
                    const data = await response.json();

                    if (data.status === 'success') {
                        this.updateDashboard(data.dashboard, data.detailed_analysis);
                        this.hideLoading();
                        this.showDashboard();
                    } else {
                        throw new Error(data.message || '모니터링 데이터 수집 실패');
                    }
                } catch (error) {
                    console.error('모니터링 시작 실패:', error);
                    alert('모니터링 시작 중 오류가 발생했습니다: ' + error.message);
                    this.hideLoading();
                }
            }

            updateDashboard(dashboard, detailedAnalysis) {
                // 메트릭 업데이트
                document.getElementById('volatility-index').textContent = dashboard.trend_status.volatility_index.toFixed(1);
                document.getElementById('competitor-count').textContent = dashboard.competitor_status.total_competitors;
                document.getElementById('market-health').textContent = dashboard.market_health.status;
                document.getElementById('active-alerts').textContent = dashboard.alerts_summary.total_alerts;

                // 알림 업데이트
                this.updateAlerts(detailedAnalysis.competitor_analysis.alerts);

                // 차트 업데이트
                this.updateCharts(detailedAnalysis);
            }

            updateAlerts(alerts) {
                const container = document.getElementById('alerts-container');
                container.innerHTML = '';

                if (alerts.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-center py-4">현재 알림이 없습니다</p>';
                    return;
                }

                alerts.slice(0, 10).forEach(alert => {
                    const alertElement = document.createElement('div');
                    let alertClass = 'alert-medium';

                    if (alert.severity === 'high') alertClass = 'alert-high';
                    if (alert.severity === 'critical') alertClass = 'alert-critical';

                    alertElement.className = alertClass;
                    alertElement.innerHTML = `
                        <div class="flex items-start">
                            <div class="flex-shrink-0">
                                <svg class="w-5 h-5 text-orange-600 dark:text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.464 0L4.35 18.5c-.77.833.192 2.5 1.732 2.5z"></path>
                                </svg>
                            </div>
                            <div class="ml-3">
                                <p class="text-sm font-medium text-gray-900 dark:text-white">
                                    ${alert.message}
                                </p>
                                <p class="text-xs text-gray-600 dark:text-gray-400 mt-1">
                                    ${alert.type} • ${new Date().toLocaleTimeString()}
                                </p>
                            </div>
                        </div>
                    `;
                    container.appendChild(alertElement);
                });
            }

            updateCharts(detailedAnalysis) {
                // 트렌드 차트 업데이트
                this.updateTrendChart(detailedAnalysis.trend_analysis);

                // 경쟁 차트 업데이트
                this.updateCompetitionChart(detailedAnalysis.competitor_analysis);
            }

            updateTrendChart(trendData) {
                const ctx = document.getElementById('trendChart').getContext('2d');

                if (this.charts.trend) {
                    this.charts.trend.destroy();
                }

                const trends = trendData.trend_changes.slice(0, 10);

                this.charts.trend = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: trends.map(t => t.keyword),
                        datasets: [{
                            label: '변화율 (%)',
                            data: trends.map(t => t.change_percentage),
                            backgroundColor: trends.map(t =>
                                t.change_percentage > 0 ? 'rgba(34, 197, 94, 0.6)' : 'rgba(239, 68, 68, 0.6)'
                            ),
                            borderColor: trends.map(t =>
                                t.change_percentage > 0 ? 'rgba(34, 197, 94, 1)' : 'rgba(239, 68, 68, 1)'
                            ),
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }

            updateCompetitionChart(competitorData) {
                const ctx = document.getElementById('competitionChart').getContext('2d');

                if (this.charts.competition) {
                    this.charts.competition.destroy();
                }

                const competitions = competitorData.competition_analysis.channel_competition.slice(0, 8);

                this.charts.competition = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: competitions.map(c => c.mall_name),
                        datasets: [{
                            data: competitions.map(c => c.competition_score),
                            backgroundColor: [
                                'rgba(59, 130, 246, 0.6)',
                                'rgba(16, 185, 129, 0.6)',
                                'rgba(245, 158, 11, 0.6)',
                                'rgba(239, 68, 68, 0.6)',
                                'rgba(147, 51, 234, 0.6)',
                                'rgba(236, 72, 153, 0.6)',
                                'rgba(34, 197, 94, 0.6)',
                                'rgba(251, 113, 133, 0.6)'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }

            async addToWatchlist() {
                if (!this.currentKeyword) {
                    alert('먼저 키워드를 검색해주세요');
                    return;
                }

                try {
                    const response = await fetch('/api/monitoring/watchlist', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            action: 'add',
                            keywords: [this.currentKeyword]
                        })
                    });

                    const data = await response.json();
                    if (data.status === 'success') {
                        alert(`"${this.currentKeyword}"이(가) 워치리스트에 추가되었습니다`);
                        this.loadWatchlist();
                    }
                } catch (error) {
                    console.error('워치리스트 추가 실패:', error);
                }
            }

            async loadWatchlist() {
                try {
                    const response = await fetch('/api/monitoring/watchlist', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ action: 'list' })
                    });

                    const data = await response.json();
                    if (data.status === 'success') {
                        this.watchlist = data.watchlist;
                        this.updateWatchlistDisplay();
                    }
                } catch (error) {
                    console.error('워치리스트 로딩 실패:', error);
                }
            }

            updateWatchlistDisplay() {
                const container = document.getElementById('watchlist-container');
                container.innerHTML = '';

                if (this.watchlist.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-sm">워치리스트가 비어있습니다</p>';
                    return;
                }

                this.watchlist.forEach(keyword => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-2 bg-gray-50 dark:bg-gray-700 rounded text-sm';
                    item.innerHTML = `
                        <span class="text-gray-900 dark:text-white">${keyword}</span>
                        <button onclick="monitoringDashboard.monitorFromWatchlist('${keyword}')" class="text-blue-600 dark:text-blue-400 hover:underline text-xs">
                            모니터링
                        </button>
                    `;
                    container.appendChild(item);
                });
            }

            monitorFromWatchlist(keyword) {
                document.getElementById('monitoring-keyword').value = keyword;
                this.startMonitoring();
            }

            async refreshAlerts() {
                if (!this.currentKeyword) return;

                try {
                    const response = await fetch(`/api/monitoring/alerts/${encodeURIComponent(this.currentKeyword)}`);
                    const data = await response.json();

                    if (data.status === 'success') {
                        this.updateAlerts(data.alerts);
                        document.getElementById('active-alerts').textContent = data.alert_summary.total_alerts;
                    }
                } catch (error) {
                    console.error('알림 새로고침 실패:', error);
                }
            }

            startAutoRefresh() {
                this.autoRefreshInterval = setInterval(() => {
                    if (this.currentKeyword) {
                        this.refreshAlerts();
                    }
                }, 30000); // 30초마다
            }

            showLoading() {
                document.getElementById('loading-indicator').classList.remove('hidden');
                document.getElementById('dashboard-metrics').classList.add('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            }

            hideLoading() {
                document.getElementById('loading-indicator').classList.add('hidden');
            }

            showDashboard() {
                document.getElementById('dashboard-metrics').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            }

            viewWatchlist() {
                alert(`워치리스트 (${this.watchlist.length}개): ${this.watchlist.join(', ')}`);
            }
        }

        // 전역 인스턴스 생성
        let monitoringDashboard;

        document.addEventListener('DOMContentLoaded', () => {
            monitoringDashboard = new MonitoringDashboard();
        });
    </script>
</body>
</html>
