<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Naver Market Insights Pro{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <link href="/static/css/output.css" rel="stylesheet">
    <!-- Fallback CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <!-- noUiSlider for range sliders -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    
    <!-- Custom styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb !important;
            color: #1f2937 !important;
            transition: background-color 0.3s ease, color 0.3s ease !important;
        }

        .dark body {
            background-color: #111827 !important;
            color: #f3f4f6 !important;
        }

        /* Navigation styles with alpha */
        .bg-white\/80 {
            background-color: rgba(255, 255, 255, 0.8) !important;
        }

        .dark .bg-white\/80 {
            background-color: rgba(31, 41, 55, 0.8) !important;
        }

        .bg-gray-800\/80 {
            background-color: rgba(31, 41, 55, 0.8) !important;
        }

        .dark .bg-gray-800\/80 {
            background-color: rgba(31, 41, 55, 0.8) !important;
        }

        /* Dark mode navigation */
        .dark nav {
            background-color: rgba(31, 41, 55, 0.8) !important;
        }

        /* Dark mode main content */
        .dark main {
            background-color: #111827 !important;
        }

        /* Dark mode footer */
        .dark footer {
            background-color: #1f2937 !important;
            border-color: #374151 !important;
        }

        /* Ensure Tailwind classes work */
        .test-visible {
            background-color: #ef4444 !important;
            color: white !important;
            padding: 1rem !important;
        }

        /* Force basic styling with dark mode support */
        .container {
            max-width: 1200px !important;
            margin: 0 auto !important;
            padding: 0 1rem !important;
        }

        .bg-white {
            background-color: #ffffff !important;
        }

        .dark .bg-white {
            background-color: #1f2937 !important;
        }

        .bg-gray-50 {
            background-color: #f9fafb !important;
        }

        .dark .bg-gray-50 {
            background-color: #111827 !important;
        }

        .bg-gray-800 {
            background-color: #1f2937 !important;
        }

        .dark .bg-gray-800 {
            background-color: #1f2937 !important;
        }

        .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1) !important;
        }

        .dark .shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3) !important;
        }

        .rounded-lg {
            border-radius: 0.5rem !important;
        }

        .p-6 {
            padding: 1.5rem !important;
        }

        .mb-8 {
            margin-bottom: 2rem !important;
        }

        .grid {
            display: grid !important;
        }

        .gap-6 {
            gap: 1.5rem !important;
        }

        .text-3xl {
            font-size: 1.875rem !important;
            line-height: 2.25rem !important;
        }

        .font-bold {
            font-weight: 700 !important;
        }

        .text-gray-900 {
            color: #111827 !important;
        }

        .dark .text-gray-900 {
            color: #f9fafb !important;
        }

        .text-white {
            color: #ffffff !important;
        }

        .dark .text-white {
            color: #ffffff !important;
        }

        .text-gray-600 {
            color: #4b5563 !important;
        }

        .dark .text-gray-600 {
            color: #9ca3af !important;
        }

        .text-gray-400 {
            color: #9ca3af !important;
        }

        .dark .text-gray-400 {
            color: #6b7280 !important;
        }

        .text-gray-500 {
            color: #6b7280 !important;
        }

        .dark .text-gray-500 {
            color: #9ca3af !important;
        }

        .text-gray-800 {
            color: #1f2937 !important;
        }

        .dark .text-gray-800 {
            color: #f9fafb !important;
        }

        .text-gray-300 {
            color: #d1d5db !important;
        }

        .dark .text-gray-300 {
            color: #d1d5db !important;
        }

        .text-gray-200 {
            color: #e5e7eb !important;
        }

        .dark .text-gray-200 {
            color: #e5e7eb !important;
        }

        .bg-gray-200 {
            background-color: #e5e7eb !important;
        }

        .dark .bg-gray-200 {
            background-color: #374151 !important;
        }

        .bg-gray-700 {
            background-color: #374151 !important;
        }

        .dark .bg-gray-700 {
            background-color: #4b5563 !important;
        }

        .bg-gray-100 {
            background-color: #f3f4f6 !important;
        }

        .dark .bg-gray-100 {
            background-color: #374151 !important;
        }

        .border-gray-200 {
            border-color: #e5e7eb !important;
        }

        .dark .border-gray-200 {
            border-color: #374151 !important;
        }

        .border-gray-700 {
            border-color: #374151 !important;
        }

        .dark .border-gray-700 {
            border-color: #4b5563 !important;
        }

        /* Tooltip 용어 스타일 */
        .tooltip-term {
            cursor: help !important;
            color: #3b82f6 !important;
            border-bottom: 1px dotted #3b82f6 !important;
            text-decoration: none !important;
            transition: color 0.2s ease !important;
        }

        .tooltip-term:hover {
            color: #1d4ed8 !important;
            border-bottom-color: #1d4ed8 !important;
        }

        .dark .tooltip-term {
            color: #60a5fa !important;
            border-bottom-color: #60a5fa !important;
        }

        .dark .tooltip-term:hover {
            color: #93c5fd !important;
            border-bottom-color: #93c5fd !important;
        }

        @media (min-width: 768px) {
            .md\\:grid-cols-4 {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            }
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
    <!-- Navigation -->
    <nav class="bg-white/80 dark:bg-gray-800/80 shadow-md backdrop-blur-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2 text-gray-800 dark:text-white hover:opacity-80 transition-opacity">
                        <span class="text-2xl">🚀</span>
                        <span class="text-xl font-bold">Market Insights Pro</span>
                    </a>
                </div>
                
                <div class="flex items-center">
                    <!-- Navigation menu -->
                    <div class="hidden md:block">
                        <div class="flex items-center space-x-1">
                            <a href="/" class="text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-primary-600 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
                                Dashboard
                            </a>
                        </div>
                    </div>
                    <!-- Theme Toggle is dynamically added here by main.js -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-16">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <div class="text-center text-gray-500 dark:text-gray-400 text-sm">
                <p>Naver Market Insights Pro v1.3.0 - Powered by Advanced Analytics</p>
                <p class="mt-1">
                    <span class="inline-flex items-center space-x-4">
                        <span>FastAPI</span>
                        <span>•</span>
                        <span>Tailwind CSS</span>
                        <span>•</span>
                        <span>Chart.js</span>
                        <span>•</span>
                        <span>Redis</span>
                    </span>
                </p>
            </div>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
