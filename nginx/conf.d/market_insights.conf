# Market Insights Pro Virtual Host Configuration
# API 서버 및 정적 파일 서빙

server {
    listen 80;
    server_name localhost market-insights.local _;

    # 로그 설정
    access_log /var/log/nginx/market_insights_access.log main;
    error_log /var/log/nginx/market_insights_error.log;

    # Root 디렉토리
    root /var/www/html;
    index index.html index.htm;

    # API 엔드포인트 프록시
    location /api/ {
        # Rate limiting 적용
        limit_req zone=api_limit burst=20 nodelay;

        # 업스트림으로 프록시
        proxy_pass http://market_insights_backend/;

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 버퍼링 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # HTTP/1.1 사용 및 연결 유지
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 헬스체크 엔드포인트
    location /health {
        proxy_pass http://market_insights_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 헬스체크는 캐싱하지 않음
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 메트릭 엔드포인트 (Prometheus)
    location /metrics {
        proxy_pass http://market_insights_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 메트릭은 빠른 응답이 필요
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # WebSocket 지원 (실시간 업데이트용)
    location /ws {
        proxy_pass http://market_insights_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 타임아웃
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 파일 업로드 엔드포인트
    location /upload {
        limit_req zone=upload_limit burst=5 nodelay;

        proxy_pass http://market_insights_backend/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 큰 파일 업로드 지원
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 정적 파일 서빙 (CSS, JS, Images)
    location /static/ {
        alias /var/www/static/;

        # 캐싱 설정
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx";

        # Gzip 압축
        gzip_static on;

        # 404 처리
        try_files $uri $uri/ =404;
    }

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 기본 루트 처리
    location / {
        try_files $uri $uri/ @backend;
    }

    # 백엔드로 폴백
    location @backend {
        proxy_pass http://market_insights_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx 상태 페이지 (모니터링용)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.20.0.0/16;  # Docker 네트워크만 허용
        deny all;
    }

    # 보안: 숨겨진 파일 접근 차단
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

