# Nginx Main Configuration
# Market Insights Pro Load Balancer

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 최적화된 이벤트 설정
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # MIME 타입 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 포맷 정의
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 성능 최적화 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 업스트림 서버 정의 (Load Balancing)
    upstream market_insights_backend {
        # 로드 밸런싱 방식: least_conn (최소 연결 수)
        least_conn;

        # 애플리케이션 서버들
        server app1:8001 max_fails=3 fail_timeout=30s weight=1;
        server app2:8001 max_fails=3 fail_timeout=30s weight=1;
        server app3:8001 max_fails=3 fail_timeout=30s weight=1;

        # 백업 서버 (모든 서버가 다운될 경우)
        # server backup_server:8001 backup;

        # 연결 유지 설정
        keepalive 32;
    }

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=1r/s;

    # 가상 호스트 설정 포함
    include /etc/nginx/conf.d/*.conf;
}